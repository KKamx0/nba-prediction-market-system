[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgebot"
version = "0.1.0"
description = "Research agent for NBA markets on Polymarket US: statistical model prices, LLM only extracts news."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kamsochi Ekwueme" }]
# Runtime dependencies are added (and pinned) by the phase that needs them.
dependencies = [
    "httpx==0.28.1",
    "nba_api==1.12.0",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "pdfplumber==0.11.10",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
]

[project.scripts]
edgebot = "edgebot.cli:main"

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "DTZ",      # naive datetimes: every record must be timezone-aware
]
ignore = ["E501"]  # black owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs live network access (deselected in CI)",
]

[tool.coverage.run]
source = ["edgebot"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
